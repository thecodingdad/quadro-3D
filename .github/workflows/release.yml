# A tag `vX.Y.Z` -> checks, Docker image (GHCR + Docker Hub), GitHub release.
#
# Publishing goes like this:
#
#     python3 tools/bump-version.py 1.1.0
#     git commit -am "Release 1.1.0"
#     git tag v1.1.0 && git push --follow-tags
#
# Pre-releases (`v1.1.0-rc.1`) get NO `latest` and are marked as prerelease.
#
# One-off manual steps:
#   * Set the GHCR package to "public" (repo -> Packages -> Package settings),
#     otherwise nobody but the owner can pull it.
#   * For Docker Hub, add the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
#     Without them everything still runs, just without Docker Hub.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release
  packages: write   # push the image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Lower case -- the registries take nothing else, while the repo is called
  # `quadro-3D`.
  GHCR_IMAGE: ghcr.io/thecodingdad/quadro-3d
  DOCKERHUB_IMAGE: docker.io/thecodingdad/quadro-3d

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same static checks as during development (see CLAUDE.md) -- there
      # is neither a test suite nor a linter.
      - name: Catalog is valid JSON
        run: python3 -m json.tool data/parts.json > /dev/null

      - name: JS modules parse
        run: for f in web/js/*.js sw.js; do node --check "$f"; done

      # The version sits in three places. If they or the tag drift apart,
      # neither image nor release is created -- otherwise an image :1.1.0 would
      # carry an app that believes it is 1.0.0.
      - name: Tag and version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file=$(cat VERSION)
          config=$(sed -n 's/.*APP_VERSION = "\(.*\)";.*/\1/p' web/js/config.js)
          sw=$(sed -n 's/.*const CACHE = "quadro-v\(.*\)";.*/\1/p' sw.js)
          echo "tag=$tag VERSION=$file config.js=$config sw.js=$sw"
          test "$tag" = "$file" && test "$tag" = "$config" && test "$tag" = "$sw"

  docker:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # arm64 runs through QEMU. Nothing is compiled on the way:
      # python:3.12-slim exists for both architectures and aiohttp ships
      # aarch64 wheels.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without the secrets, Docker Hub simply stays out: the list of image
      # names is therefore built here and not in the template -- an empty line
      # in it would be an image name without a name.
      - name: Are there Docker Hub credentials?
        id: hub
        run: |
          ready=${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$GHCR_IMAGE"
            [ "$ready" = "true" ] && echo "$DOCKERHUB_IMAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.hub.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.hub.outputs.images }}
          # 1.2.3, 1.2 and 1 -- `latest=auto` only sets `latest` for a real
          # version, not for a pre-release. The `raw` entry only kicks in on a
          # manual run from a branch: there is no tag there, and with no tag at
          # all the build aborts.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # for the notes generated from the commits

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Pre-releases carry a hyphen (v1.1.0-rc.1).
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ### Get started without cloning

            ```bash
            docker run -d -p 8000:8000 -v quadro-data:/data ${{ env.GHCR_IMAGE }}:${{ needs.docker.outputs.version }}
            ```

            The app then lives at <http://localhost:8000/web/index.html>.
            The server has neither login nor TLS -- your own network, not openly on the internet.
